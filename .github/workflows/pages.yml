name: Pubblica il lettore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Scarica gli audio pubblici
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/audio
          gh release download audio-corrente --pattern '*.mp3' --dir docs/audio --clobber
          node Audiolibro/audio-pubblico.js docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  pubblica:
    needs: prepara
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
